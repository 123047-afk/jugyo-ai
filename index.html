
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業AI君</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#202124;
}
main{
  max-width:600px;
  margin:0 auto;
  padding:24px 16px;
}
h1{margin:0 0 6px;font-size:26px}
.sub{color:#666;margin-bottom:24px}
.card{
  background:white;
  border-radius:18px;
  padding:24px;
  box-shadow:0 2px 10px #0000000d;
  margin-bottom:16px;
}
label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}
input[type=text],select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:20px;
}
.timer{
  text-align:center;
  font-size:48px;
  font-weight:bold;
  margin:20px 0 8px;
  font-variant-numeric:tabular-nums;
}
.status{text-align:center;color:#666;margin-bottom:22px}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,.download{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}
.start{background:#1769e0;color:white}
.stop{background:#e53935;color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.notice{
  font-size:14px;
  color:#666;
  margin-top:18px;
  line-height:1.6;
}
.record{
  border-top:1px solid #eee;
  padding:16px 0;
}
.record:first-child{border-top:0}
.record strong{display:block;margin-bottom:6px}
audio{width:100%;margin:10px 0}
.download{background:#e8f0fe;color:#174ea6}
.delete{background:#eee;color:#333;margin-left:6px}
.empty{color:#777;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>🎓 授業AI君</h1>
  <div class="sub">授業を録音して、あとで復習しよう</div>

  <section class="card">
    <label for="lesson">授業タイトル</label>
    <input id="lesson" type="text" placeholder="例：数学・外心と垂心">
<label for="subject">科目</label>
<select id="subject">
  <option value="日本史">日本史</option>
  <option value="世界史">世界史</option>
  <option value="公共">公共</option>
  <option value="化学">化学</option>
  <option value="生物">生物</option>
</select>
    <div class="timer" id="timer">00:00:00</div>
    <div class="status" id="status">録音待機中</div>

    <div class="buttons">
      <button class="start" id="start">● 録音開始</button>
      <button class="stop" id="stop" disabled>■ 録音終了</button>
    </div>

    <div class="notice" id="notice">
      録音開始を押すと、マイクの使用許可を求めます。
    </div>
  </section>

  <section class="card">
    <h2>📚 録音した授業</h2>
    <div id="records">
      <div class="empty" id="empty">まだ録音はありません。</div>
    </div>
  </section>
</main>

<script>
const start = document.getElementById("start");
const stop = document.getElementById("stop");
const timer = document.getElementById("timer");
const status = document.getElementById("status");
const notice = document.getElementById("notice");
const lesson = document.getElementById("lesson");
const records = document.getElementById("records");
const empty = document.getElementById("empty");

let recorder = null;
let chunks = [];
let stream = null;
let startedAt = 0;
let timerId = null;
let elapsed = 0;

function format(seconds){
  const h = String(Math.floor(seconds/3600)).padStart(2,"0");
  const m = String(Math.floor(seconds%3600/60)).padStart(2,"0");
  const s = String(seconds%60).padStart(2,"0");
  return h+":"+m+":"+s;
}

function updateTimer(){
  elapsed = Math.floor((Date.now()-startedAt)/1000);
  timer.textContent = format(elapsed);
}

function message(text){
  notice.textContent = text;
}

start.addEventListener("click", async () => {
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    message("このChromeではマイク録音に対応していない可能性があります。");
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    chunks = [];
    startedAt = Date.now();
    elapsed = 0;
    timer.textContent = "00:00:00";

    recorder.ondataavailable = event => {
      if(event.data.size > 0) chunks.push(event.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks,{type:"audio/webm"});
      const url = URL.createObjectURL(blob);
      const title = lesson.value.trim() || "授業録音";
      const subject = document.getElementById("subject").value;
      const date = new Date().toLocaleString("ja-JP");

      const item = document.createElement("div");
      item.className = "record";

      const heading = document.createElement("strong");
      heading.textContent = subject + "｜" + title;

      const info = document.createElement("div");
      info.className = "empty";
      info.textContent = date + " / " + format(elapsed);

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = url;
      audio.preload = "none";

      const download = document.createElement("a");
      download.className = "download";
      download.textContent = "音声を保存";
      download.href = url;
      download.download = title.replace(/[\\/:*?"<>|]/g,"_")+".webm";

      const remove = document.createElement("button");
      remove.className = "delete";
      remove.textContent = "削除";
      remove.addEventListener("click",()=>{
        URL.revokeObjectURL(url);
        item.remove();
        if(records.querySelectorAll(".record").length===0){
          empty.style.display="block";
        }
      });

      item.append(heading,info,audio,download,remove);
      records.prepend(item);
      empty.style.display="none";

      if(stream){
        stream.getTracks().forEach(track=>track.stop());
        stream=null;
      }

      start.disabled=false;
      stop.disabled=true;
      status.textContent="録音待機中";
      message("録音が完成しました。音声を保存できます。");
    };

    recorder.start(1000);
    start.disabled=true;
    stop.disabled=false;
    status.textContent="🔴 録音中";
    message("録音中です。授業が終わったら録音終了を押してください。");
    timerId=setInterval(updateTimer,1000);

  }catch(error){
    if(stream) stream.getTracks().forEach(track=>track.stop());
    stream=null;
    message("マイクを使用できませんでした。Chromeのマイク許可を確認してください。");
  }
});

stop.addEventListener("click",()=>{
  if(recorder && recorder.state==="recording"){
    clearInterval(timerId);
    timerId=null;
    recorder.stop();
  }
});
</script>
</body>
</html>
